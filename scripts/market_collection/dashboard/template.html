/* Layout: 위는 일정 캘린더와 단가 추이가 메인, 가운데는 종류별 목록 + 상세(2×2 포함), 가운데는 작업(D-day 목록 + 상세), 아래는 참고(모델별 현황 · 수집 추이). */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#f7f9f8; --line:#e3e8e6; --line-strong:#c8d1cd;
  --ink:#0f1513; --body:#3a4440; --muted:#5f6a64; /* 4.5:1 이상: 회색 칩(#eceeed) 위 4.83:1, 흰 바탕 5.4:1 (2026-10-25 고칠 목록) */
  --mint:#00ab7f; --mint-ink:#00694d; --mint-soft:#e2f4ec;
  --amber:#8f5300; --amber-soft:#fbeed7;
  --slate:#3f5273; --slate-soft:#e7ecf4;
  --grey-soft:#eceeed;
  --up:#d6403f; --down:#2a78d6; --emph:#00936d; --deemph:#bcc5c1; --track:#e8ecea;
  --nav:#101413; --nav-ink:#ffffff; --nav-muted:#a3aca8;
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --r-xs:4px; --r-s:6px; --r-m:10px; --r-l:12px; --r-xl:16px; --r-pill:999px;  /* 모서리 역할: docs/design-system.md */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a1f1d; --surface-2:#202624; --line:#2b3330; --line-strong:#3c4642;
  --ink:#eef2f0; --body:#c7d0cb; --muted:#909a95;
  --mint:#33c79a; --mint-ink:#5fd9b1; --mint-soft:#15382d;
  --amber:#f0b45a; --amber-soft:#38290f;
  --slate:#a3b6d8; --slate-soft:#222c3b;
  --grey-soft:#272d2b;
  --up:#e66767; --down:#3987e5; --emph:#1fa67e; --deemph:#4b5551; --track:#262d2a;
  --nav:#0b0e0d; --nav-ink:#ffffff; --nav-muted:#8f9894;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a1f1d; --surface-2:#202624; --line:#2b3330; --line-strong:#3c4642;
  --ink:#eef2f0; --body:#c7d0cb; --muted:#909a95;
  --mint:#33c79a; --mint-ink:#5fd9b1; --mint-soft:#15382d;
  --amber:#f0b45a; --amber-soft:#38290f;
  --slate:#a3b6d8; --slate-soft:#222c3b;
  --grey-soft:#272d2b;
  --up:#e66767; --down:#3987e5; --emph:#1fa67e; --deemph:#4b5551; --track:#262d2a;
  --nav:#0b0e0d; --nav-ink:#ffffff; --nav-muted:#8f9894;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:20px;min-height:54px;padding-inline:24px;background:var(--nav);color:var(--nav-ink)}
.top img{height:19px;width:auto;display:block}
.top .tool{color:var(--nav-muted);font-size:13px;padding-left:16px;border-left:1px solid #3a3f3d;white-space:nowrap}
.top .base{margin-left:auto;color:var(--nav-muted);font-size:13px;white-space:nowrap}
@media (max-width:640px){.top{padding-inline:16px;gap:12px}.top .tool{display:none}}
@media (max-width:640px){.top{flex-wrap:wrap;row-gap:8px;padding-block:8px}.top .base{margin-left:0}}  /* 화면 탭이 들어가 좁으면 줄을 바꾼다 */

.wrap{max-width:1380px;margin:0 auto;padding-inline:24px;padding-block:24px 56px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.wrap{padding-inline:16px}}
.title{display:block;min-width:0}
.title h1{margin:0;font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.summary-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:12px}
.summary-item,.summary-note{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;padding:16px;background:var(--surface);border:0;border-radius:var(--r-l)}
.summary-label,.summary-note span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.summary-item strong,.summary-note strong{font-size:26px;line-height:1.2;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.summary-sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:1000px){.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.summary-item,.summary-note{padding:12px}}
@media (max-width:360px){.summary-grid{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:0;border-radius:var(--r-xl);padding:20px;min-width:0}
@media (max-width:640px){.card{padding:16px}}
.ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:0 0 12px}
.ch h2{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.ch span{font-size:13px;color:var(--muted)}
.ch .keys{margin-left:auto;display:flex;gap:12px}
.ch .keys i{display:inline-block;width:10px;height:10px;border-radius:var(--r-xs);margin-right:4px;vertical-align:-1px}

/* ---- 1. 판단 한 줄 ---- */
.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:stretch}
@media (max-width:900px){.overview{grid-template-columns:minmax(0,1fr)}}

.mx{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto;gap:8px}
.mx .xh{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.mx .yh{font-size:12px;font-weight:600;color:var(--muted);line-height:1.35;align-self:center}
.q{display:flex;flex-direction:column;gap:2px;min-width:0;min-height:96px;padding:12px;border:1px solid transparent;border-radius:var(--r-l);text-align:left;cursor:pointer}
.q .nm{font-size:13px;font-weight:700;color:var(--ink)}
.q .ct{font-size:26px;font-weight:750;line-height:1.1;color:var(--ink);letter-spacing:-.02em}
.q .ct small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.q .top1{margin-top:auto;font-size:12px;color:var(--body);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .top1 b{font-weight:700;color:var(--ink)}
.q.review{background:var(--mint-soft)} .q.verify{background:var(--amber-soft)} .q.watch{background:var(--slate-soft)} .q.record{background:var(--grey-soft)}
.q.zero{background:var(--surface-2)}
.q.zero .ct,.q.zero .nm{color:var(--muted)}
.q:hover{border-color:var(--line-strong)}
.q[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hold{grid-column:2/4;display:flex;align-items:center;gap:12px;min-height:0;padding:8px 12px;border:1px dashed var(--line-strong);background:transparent;flex-direction:row}
.hold .ct{font-size:22px;margin-left:auto}
.hold .top1{margin:0;flex:1}
.mxf{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.mxf p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.allb{flex:none;height:28px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);font-size:13px;cursor:pointer}

@media (max-width:600px){.opts li{grid-template-columns:minmax(0,1fr)}.opts .need{grid-column:auto}}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:13px}

/* ---- 3. 참고 영역 ---- */
.ref2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}

.models .scroll{overflow-x:auto}

.cols{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line-strong)}

.tv{margin-top:8px;font-size:12px;color:var(--muted)}

.tv table{margin-top:8px;font-size:12px}
.tip{position:fixed;z-index:20;pointer-events:none;max-width:260px;padding:8px 12px;border-radius:var(--r-l);background:var(--ink);color:var(--surface);font-size:12px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.18)}

/* ---- 단가 추이 ---- */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#6250d6;--s4:#eda100;--s5:#e87ba4;--s6:#008300}  /* 선 색 순서: docs/design-system.md */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#9085e9;--s4:#c98500;--s5:#d55181;--s6:#008300}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#9085e9;--s4:#c98500;--s5:#d55181;--s6:#008300}
.trend .th{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-bottom:2px}
.trend .th h2{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.trend .th .mname{font-size:18px;font-weight:750;color:var(--ink);letter-spacing:-.01em}
.trend .th .unit{font-size:12px;color:var(--muted)}
/* 선택 묶음(2026-10-30 박건 결정): 기간·가격 조건·항목을 한 줄씩, 이름을 앞에 두고 묶음 테두리로 감싼다. 한 줄에 다 안 들어가면 펼침 목록(.tsel) */
.tctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;margin:12px 0 0}
.tlab{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;flex-wrap:nowrap;gap:2px;justify-self:start;max-width:100%;overflow:hidden;padding:2px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface-2)}
.seg button{flex:none;height:28px;padding:0 12px;border:0;border-radius:var(--r-pill);background:transparent;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--body)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--mint-soft);color:var(--mint-ink);font-weight:700}
.tsel{position:relative;justify-self:start;max-width:100%}
.tsel select{appearance:none;-webkit-appearance:none;max-width:min(100%,480px);height:34px;padding:0 36px 0 16px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface-2);color:var(--mint-ink);font:inherit;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tsel::after{content:"";position:absolute;right:16px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.lg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:4px 0 0;font-size:12px;color:var(--body)}  /* 범례(3번 그래프): 올리면 그 선이 진해진다 */
.lg span{display:inline-flex;align-items:center;gap:8px;padding:2px 4px;border-radius:var(--r-s)}
.lg span.on{background:var(--surface-2)}
.lg i{display:inline-block;width:14px;height:0;border-top:2px solid;border-radius:var(--r-xs)}
.lg .lr i{border-top-width:3px}
.lg b{font-weight:700;color:var(--ink)}
.lg small{color:var(--muted)}
.lg .via{padding-left:0;font-weight:700;color:var(--muted)}
.lrn{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
.lrn b{margin-right:8px;font-weight:700;color:var(--mint-ink)}
.tplot{position:relative;width:100%}
.tplot svg{display:block;width:100%;height:auto;overflow:visible}
.tplot text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.tplot text.an{fill:var(--body);font-weight:600}
.tplot .grid{stroke:var(--line);stroke-width:1}
.tplot .base{stroke:var(--line-strong);stroke-width:1}
.tplot .today{stroke:var(--ink);stroke-width:1}
.tplot .xh{stroke:var(--ink);stroke-width:1;opacity:.35;stroke-dasharray:3 3}
.tplot .ann{stroke:var(--line-strong);stroke-width:1}
.tplot .pt{cursor:pointer}
.tplot .pt:focus{outline:none}
.tplot .pt:focus-visible circle.v{stroke:var(--ink);stroke-width:2.5}
.tnote{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.55}
.tfoot{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.tfoot .tv{margin-top:2px}
.tfoot .tv p{margin:8px 0 0;max-width:900px;line-height:1.6}
.tnote b{color:var(--body);font-weight:650}
/* 화면 탭(2026-10-28 박건 요청): 변화 | 모델별 가격. body[data-page]가 보일 칸을 정한다. */
.ptabs{display:flex;gap:4px}
.ptabs button{height:32px;padding:0 12px;border:0;border-radius:var(--r-pill);background:none;color:var(--nav-muted);font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
.ptabs button:hover{color:var(--nav-ink)}
.ptabs button[aria-selected="true"]{background:var(--nav-ink);color:var(--nav)}
body[data-page="models"] .summary-grid,body[data-page="models"] .hero,body[data-page="models"] .work{display:none}
body:not([data-page="models"]) .mpage{display:none}
/* 수집 상태 화면(2026-10-28 박건 제안): 실패 중인 출처, 최근 실패 기록, 원문 재검증, 등록부 점검 */
body[data-page="health"] .summary-grid,body[data-page="health"] .hero,body[data-page="health"] .work,body[data-page="health"] #hwarn{display:none}
body:not([data-page="health"]) .hpage{display:none}
.hwarn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 0;padding:12px 12px;border:1px solid var(--amber);border-radius:var(--r-m);background:var(--amber-soft);font-size:13px;color:var(--ink)}
.hwarn button{height:28px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);font-size:13px;color:var(--ink);cursor:pointer}
.hsum{margin:4px 0 0;font-size:13px;color:var(--body)}
.hsec{margin-top:20px;overflow-x:auto}  /* 폭 375px: 넓은 표는 구역 안에서 가로로 스크롤 */
.hsec h3{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--ink)}
.hsec p.note{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.55}
.hsec p.hcount{margin:0 0 8px;font-size:13px;color:var(--ink)}
.hsec table{width:100%;font-size:13px}
.hsec td,.hsec th{padding:8px 8px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.hsec th{color:var(--muted);font-weight:650}
.hsec td small{display:block;color:var(--muted)}
.hsec td .hst + small{margin-top:4px}
.hsec .none{font-size:13px;color:var(--muted)}
.hst{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-pill);font-size:11px;font-weight:700;white-space:nowrap}
.hst.bad{background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber)} .hst.ok{background:var(--mint-soft);color:var(--mint-ink)} .hst.gone{background:var(--grey-soft);color:var(--muted)}
.mpage{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.mlist{padding:12px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}  /* 모델 목록 높이 제한(2026-10-28): 화면보다 긴 목록은 아래쪽 모델을 고르려면 그래프가 화면 밖으로 밀려서 목록 안에서 스크롤한다 */
.mlist h3{margin:12px 8px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.mlist h3:first-child{margin-top:2px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 8px;border:0;border-radius:var(--r-m);background:none;text-align:left;font-size:13px;color:var(--ink);cursor:pointer}
.mrow small{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.mrow small.up{color:var(--up)} .mrow small.down{color:var(--down)}
.mrow:hover{background:var(--grey-soft)}
.mrow[aria-pressed="true"]{background:var(--mint-soft);font-weight:700}
@media (max-width:900px){.mpage{grid-template-columns:minmax(0,1fr)}.mlist{position:static;display:flex;flex-wrap:wrap;gap:4px;max-height:max(240px,40vh)}.mlist h3{width:100%}.mrow{width:auto}}
.ptable .th{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.ptable .th h2{margin:0;font-size:15px;font-weight:700;color:var(--ink)}
.ptable .th span{font-size:12px;color:var(--muted)}
.mchip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);font-size:12px;cursor:pointer;color:var(--ink)}
.mchip small{font-size:11px;font-weight:650;color:var(--muted)}
.mchip small.up{color:var(--up)} .mchip small.down{color:var(--down)}
.mchip:hover{border-color:var(--ink)}
.mchip[aria-pressed="true"]{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink);font-weight:700}
.mchip[aria-pressed="true"] small{color:var(--mint-ink)}
.tlink{margin-top:12px;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--surface);font-size:13px;color:var(--ink);cursor:pointer}
.tlink:hover{border-color:var(--ink)}
/* 2026-10-28 가안: 카드 상세의 모델별 가격 링크(가격 추이·현재 가격 표), 변동 잦음 묶음 */
.vgbtn{display:flex;flex-wrap:wrap;gap:0 8px}
.vgbtn .tlink{height:auto;min-height:32px;padding:4px 12px;flex-wrap:wrap;text-align:left}
.tlink small{color:var(--muted);font-size:12px;font-weight:500}
.row.vg{box-shadow:inset 3px 0 0 var(--line-strong)}
.vgnote{margin:12px 0 0;font-size:13px;line-height:1.6;color:var(--body)}
.vgh{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--ink)}

/* ---- v16: 캘린더·그래프 메인, 종류별 목록, 상세 2×2 ---- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:stretch}  /* 단가 추이는 모델별 가격 화면으로(2026-10-28) */
.day{min-height:80px}
.ev{height:22px;font-size:12px;gap:4px}
.ev.t-price{background:var(--mint-soft)} .ev.t-model{background:var(--slate-soft)} .ev.t-cond{background:var(--grey-soft)} .ev.t-data{background:var(--amber-soft)}
.ev b.ar{flex:none;margin-left:auto;font-size:11px;font-weight:800}
.ev b.ar.up{color:var(--up)} .ev b.ar.down{color:var(--down)}
.ti-price{background:var(--mint)} .ti-model{background:var(--slate)} .ti-cond{background:var(--muted)} .ti-data{background:var(--amber)}
.grp h3 i.ti-price,.grp h3 i.ti-model,.grp h3 i.ti-cond,.grp h3 i.ti-data{width:9px;height:9px;border-radius:var(--r-xs)}
.grp h3{font-size:13px;color:var(--ink);margin-top:16px}
.grp:first-child h3{margin-top:4px}
.qs{display:inline-block;margin-right:8px;padding:0 4px;border-radius:var(--r-s);font-size:11px;font-weight:700;line-height:17px;vertical-align:1px}
.qs.review{background:var(--mint-soft);color:var(--mint-ink)} .qs.verify{background:var(--amber-soft);color:var(--amber)} .qs.watch{background:var(--slate-soft);color:var(--slate)} .qs.record{background:var(--grey-soft);color:var(--muted)} .qs.pending{border:1px dashed var(--line-strong);color:var(--muted);line-height:15px}
.trend .th{margin-bottom:0}
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0 8px}
.tstat.let{background:var(--mint-soft)} .tstat.let .k{color:var(--mint-ink)}  /* 렛서 경로 칸 */
.tstat{min-width:0;padding:12px 16px;border-radius:var(--r-l);background:var(--surface-2)}
.tstat .k{font-size:12px;font-weight:650;color:var(--muted)}
.tstat .v{margin-top:4px;font-size:26px;font-weight:750;line-height:1.2;color:var(--ink);letter-spacing:-.01em}
.tstat .v small{margin-left:4px;font-size:13px;font-weight:750;white-space:nowrap}
.tstat .v small.up{color:var(--up)} .tstat .v small.down{color:var(--down)}
.tstat .s{margin-top:2px;font-size:12px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.tplot text{font-size:12px}
.tplot text.el{fill:var(--ink);font-weight:750;font-size:12px}
.tplot text.el.lo{fill:var(--muted);font-weight:500}
/* 가격 추이 선(3번 그래프, docs/design-system.md): 평소 --lc(낮은 채도), 올리면 --fc(원래 색). 렛서 경로 선(.lr)은 민트 3px */
.tplot .ln line{stroke:var(--lc);stroke-width:2;stroke-linecap:round;pointer-events:none}  /* 선 위에 올려도 툴팁이 뜨게: 점(.pt)만 누를 수 있다 */
.tplot .ln.lr line,.tplot .ln.on line{stroke-width:3}
.tplot .ln.on line{stroke:var(--fc)}
.tplot .ln circle.v{fill:var(--lc);stroke:var(--surface);stroke-width:2}
.tplot .ln.on circle.v{fill:var(--fc)}
.tplot .ln circle.v.fut,.tplot .ln circle.v.miss{fill:var(--surface);stroke:var(--lc)}
.tplot .ln.on circle.v.fut,.tplot .ln.on circle.v.miss{stroke:var(--fc)}
.tplot .ln line.miss{stroke-width:2}
.tplot svg.focus .ln{opacity:.3}
.tplot svg.focus .ln.on{opacity:1}
.tplot .ttip{position:absolute;top:8px;z-index:2;min-width:220px;max-width:min(340px,100%);padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-l);background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:12px;line-height:1.45;color:var(--body);pointer-events:none}
.tplot .ttip b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.tplot .ttip small{display:block;margin-bottom:4px;color:var(--muted)}
.tplot .ttip table{width:100%;font-size:12px}
.tplot .ttip td{padding:2px 0;border:0;vertical-align:middle;white-space:nowrap}
.tplot .ttip td.n{padding-left:12px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.tplot .ttip td.d{padding-left:8px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tplot .ttip tr.on td{font-weight:700;color:var(--ink)}
.tplot .ttip i{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%}
.tplot .ttip .lrt{margin-left:4px;padding:0 4px;border-radius:var(--r-xs);background:var(--mint-soft);color:var(--mint-ink);font-size:11px;font-weight:700}
.tplot .ttip em{margin-left:4px;font-style:normal;font-size:11px;color:var(--muted)}
.why2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(220px,1fr);gap:20px;margin-top:20px;align-items:start}
.why2.solo{grid-template-columns:minmax(0,340px)}
@media (max-width:760px){.why2,.why2.solo{grid-template-columns:minmax(0,1fr)}}
.why2 .pc{margin-top:0}
.dmx h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.dmx .g{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr);gap:4px}
.dmx .xh{font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.dmx .yh{font-size:11px;font-weight:600;color:var(--muted);line-height:1.3;align-self:center}
.dmx .c{display:flex;flex-direction:column;justify-content:space-between;gap:2px;min-height:48px;padding:8px 8px;border-radius:var(--r-m);background:var(--surface-2);font-size:12px;font-weight:650;color:var(--muted)}
.dmx .c.on{color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dmx .c.on.review{background:var(--mint-soft)} .dmx .c.on.verify{background:var(--amber-soft)} .dmx .c.on.watch{background:var(--slate-soft)} .dmx .c.on.record{background:var(--grey-soft)}

.dmx .hd{grid-column:2/4;padding:8px 8px;border:1px dashed var(--line-strong);border-radius:var(--r-m);font-size:12px;font-weight:650;color:var(--muted)}
.dmx .hd.on{border-style:solid;border-color:var(--ink);border-width:2px;color:var(--ink)}
.dmx p{margin:8px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
.qs.t7{background:var(--slate-soft);color:var(--slate)}
.more tr.same td{color:var(--muted)}
.cnd.note{margin:8px 0 0;font-size:12px}

  // 선(3번 그래프, 2026-10-30): 공급자 고정 색을 평소에는 채도를 낮춰 2px로, 렛서 경로 선은 민트 3px로 그린다. 흐림 = 시작 시점 기록 없음,

  const lines = M.series.map((se, si) => se.letsur ? "" : group(se, si)).join("") + M.series.map((se, si) => se.letsur ? group(se, si) : "").join("");
  // 오른쪽 끝 글자(3번 그래프): 렛서 경로 값과 그래프 안 최저 값만

  // 올리면(3번 그래프): 가장 가까운 선만 원래 색으로 진하게, 툴팁은 그 날의 모든 선을 싼 순서로 같은 조건 최저 대비와 함께

// 정렬: 추천 순(렛서 판단 단계 → 급한 순 → Suggested Action) · 적용일 순(급한 순 → Suggested Action) · 유형별(종류 묶음 안에서 급한 순)
// 렛서 판단 단계(2026-10-28 가안): 3팀 서면보고에 적힌 렛서 판단 순서(지금 쓰는 판매처 → 판매 중단 위험과 기한 → 같은 조건의 비용 증감
// → 대신 쓸 판매처 → 보안·계약상 빼야 할 곳)를 따른다. 원문은 확인 전이고, 보안·계약 기준은 렛서 신뢰 공급사 목록이 없어 비워 둔다.
// 0 렛서 경로의 판매 중단 · 1 렛서 경로의 비용 증감 · 2 렛서 경로의 그 밖 · 3 사용 경로 모름 · 4 다른 경로의 대신 쓸 만한 변화(인하·할인·경로 추가)
// · 5 다른 경로의 그 밖 · 6 렛서가 쓰지 않는 모델 · 7 기록(RECORD)
function tierOf(e){
  if (actionKey(e) === "record") return 7;
  const r = relOf(e), t = EV7[e.id];
  if (r === "use") return t === "제공 종료" || (t === "공급 경로 변경" && /중단/.test(EV7SUB[e.id] || "")) ? 0 : ["가격 변경", "예정 변경", "한시 할인", "조건·가격 변경"].includes(t) ? 1 : 2;
  if (r === "unk") return 3;
  if (r === "other") return dirOf(e) === "good" ? 4 : 5;
  return 6;
}
function recCmp(a, b){ return tierOf(a) - tierOf(b) || cmpU(a, b) || actOrder(a) - actOrder(b); }
function queueCmp(a, b){ return state.queueSort === "date" ? cmpU(a, b) || actOrder(a) - actOrder(b) : recCmp(a, b); }
function queueRow(e){ return `<li>
    <button type="button" class="row${e.done ? " done" : ""}" data-id="${esc(e.id)}" aria-current="${state.sel === e.id}">
      <span class="dl2"${!e.eff && e.effShort ? ` title="${esc(e.effShort)}"` : ""}>${ddHtml(e)}${e.eff ? `<small class="tn">${md(e.eff)}${e.effQual ? ` <b class="qt" title="${esc(e.effQual)}">해석</b>` : ""}</small>` : e.effSeen ? `<small class="tn">${md(e.cd)}</small>` : ""}</span>
      <span class="t"><span class="qbadges">${qchips(e)}</span><b><span class="subj">${esc(e.m)}</span> ${esc(e.sum)}${e.done ? `<span class="tags"><span class="tg">결정됨</span></span>` : ""}</b><span><span class="qs t7">${esc(EV7[e.id] || "수집 확인")}</span>${esc(e.ch)}</span></span>
    </button></li>`; }
// 변동 잦음 묶음: 정렬된 목록에서 묶음 구성원은 맨 앞 구성원 자리에 한 줄로 모은다. 날짜 칸은 묶인 카드 수와 기간이다.
function bundled(list){ const seen = new Set();
  return list.flatMap(e => !e.vg ? [e] : seen.has(e.vg) ? [] : (seen.add(e.vg), [{vg: e.vg}])); }
function vgSum(id){ const l = VG[id], days = l.map(e => e.cd).filter(Boolean).sort();
  return {l, e0: l[0], up: l.filter(e => dirOf(e) === "bad").length, down: l.filter(e => dirOf(e) === "good").length, res: l.filter(e => e.rv).length, from: days[0], to: days[days.length - 1]}; }
function vgRow(b){ const {l, e0, up, down, res, from, to} = vgSum(b.vg);
  return `<li>
    <button type="button" class="row vg" data-id="${esc(b.vg)}" aria-current="${state.sel === b.vg}">
      <span class="dl2"><span class="dd none seen">${l.length}장</span><small class="tn">${md(from)}~</small><small class="tn">${md(to)}</small></span>
      <span class="t"><span class="qbadges"><span class="qchip vgc">변동 잦음</span>${appChip(e0)}</span><b><span class="subj">${esc(e0.m)}</span> 가격이 자주 바뀜 · 인상 ${up} · 인하 ${down}${res ? ` · 되돌아감 ${res}` : ""}</b><span><span class="qs t7">가격 변경 묶음</span>${esc(e0.ch)}</span></span>
    </button></li>`; }
const rowOf = x => x.vg && !x.id ? vgRow(x) : queueRow(x);
function renderQueue(){
  const list = EVENTS.filter(e => kindShown(e) && (showPast || !isPast(e)));
  // 선택은 거르기와 무관하다: 주소의 #id나 캘린더에서 고른 카드는 목록에서 숨겨져도 상세에 남는다. 처음 고를 때만 보이는 카드를 먼저 본다.
  // 맨 위 카드가 변동 잦음 묶음에 들면 묶음을 고른다.
  if (!state.sel || (!EVENTS.some(e => e.id === state.sel) && !VG[state.sel])) { const top = (list.length ? list : EVENTS).slice().sort(recCmp)[0]; state.sel = top && top.vg ? top.vg : top?.id; }

  if (state.queueSort !== "type") { document.getElementById("queue").innerHTML = list.length ? `<ul class="rows">${bundled(list.slice().sort(queueCmp)).map(rowOf).join("")}</ul>` : none; return; }

}

const money = v => { const m = typeof v === "string" && v.match(/^\$([\d,]+(?:\.\d+)?)$/); return m ? parseFloat(m[1].replace(/,/g, "")) : null; };
function priceBars(e){

  if (!rows.length) return "";
  return `<section class="pc"><h3>이전 → 현재 가격</h3>${rows.map(([lab, b, a, bs, as]) => { const m = Math.max(a, b), up = a > b, p = (a - b) / b * 100;

    ${editing ? `<div class="spbar"><b>${spEditing ? "편집 중" : "편집 멈춤"}</b><span>바꾼 칸 ${n}개</span><button type="button" data-sp="dl"${n ? "" : " disabled"}>변경한 경로 파일 내려받기</button><button type="button" data-sp="copy"${n ? "" : " disabled"}>JSON 복사</button><a href="${SP_FILE}" target="_blank" rel="noopener">GitHub에서 파일 편집 →</a>${spMsg ? `<span class="msg" role="status">${esc(spMsg)}</span>` : ""}</div>` : spMsg ? `<p class="note" role="status">${esc(spMsg)}</p>` : ""}
    <div class="spscroll"><table class="sptab"><thead><tr><th>모델</th>${C.map(c => `<th title="${esc(c[1].join(", "))}">${esc(c[0])}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    ${editing ? spEditBox() : ""}`;
  const nb = el.querySelector(".spscroll"); if (pos && nb) [nb.scrollTop, nb.scrollLeft] = pos;
  spPanel();
}
function spPanel(){  // 아래 칸 정보 상자: 누른 칸(또는 모델)의 수집 경로, 기록과 근거, 편집 버튼
  const el = document.getElementById("sppanel");
  if (!spSel) { el.hidden = true; document.body.classList.remove("spopen"); return; }
  const m = spSel.m, i = spSel.c, c = i == null ? null : SUPPLY.cols[i], D = spDoc() || {records: []};
  let body;
  if (c) { const s = spState(D, m, c), del = spEditing && !s.e && s.was.some(spUse);
    body = `<ul>${s.lines.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${del ? `<p class="warnl">이 기록을 지우면 이 모델의 카드가 이 경로를 쓰지 않는 것으로 바뀔 수 있습니다.</p>` : ""}
      <div class="act">${del ? `<button type="button" class="danger" data-sp="del" data-m="${esc(m)}" data-c="${i}">이 기록 지우기 (${esc([...new Set(s.was.filter(spUse).map(spChip))].join("·"))})</button>` : ""}${s.e ? `<button type="button" data-sp="undo" data-m="${esc(m)}" data-c="${i}">되돌리기</button>` : ""}${!spEditing && SUPPLY.routes ? `<span class="note">바꾸려면 위의 '편집'을 켜세요.</span>` : ""}</div>`; }
  else { const rs = D.records.filter(r => r.model_id === m), un = spHas(D.unresolved, m);
    body = `<ul><li>${SUPPLY.models[m].length ? `가격 수집: ${esc(SUPPLY.models[m].join(", "))}` : "가격 수집 안 함 (등록부에 없는 모델)"}</li>${rs.map(r => `<li>${esc(spLine(r))}</li>`).join("")}${un ? `<li>경로 미확인: ${esc(D.unresolved[m])}</li>` : ""}${!rs.length && !un ? "<li>렛서 사용 기록 없음</li>" : ""}</ul>`; }
  el.innerHTML = `<button type="button" class="x" data-sp="close" aria-label="칸 정보 닫기">×</button><h3>${esc(m)}${c ? " · " + esc(c[0]) : ""}</h3>${body}`;
  el.hidden = false; document.body.classList.add("spopen");
}
function spAct(t, key){  // key: Enter·Space로 누른 것. 다시 그린 뒤 같은 버튼(없으면 그 칸)에 포커스를 둔다
  const a = t.dataset.sp, m = t.dataset.m, i = t.dataset.c == null ? null : +t.dataset.c, c = i == null ? null : SUPPLY.cols[i], prev = spSel;
  if (a === "copy") { const done = () => { spMsg = "JSON을 복사했습니다. GitHub에서 파일 편집을 열어 내용을 모두 지우고 붙여 넣으세요."; renderSupply(); },
      fail = () => { spText = true; spMsg = "자동 복사가 막혀 아래에 JSON을 펼쳤습니다. 직접 복사하세요."; renderSupply(); const x = document.querySelector(".spedit textarea"); if (x) x.select(); };
    try { navigator.clipboard.writeText(spJson()).then(done, fail); } catch (err) { fail(); } return; }
  if (a === "edit") { spEditing = !spEditing; spText = false; }
  else if (a === "close") spSel = null;
  else if (a === "row") spSel = {m, c: null};
  else if (a === "cell") { spSel = {m, c: i}; spMsg = "";
    if (spEditing && SUPPLY.routes) { const k = spKey(m, c), e = spEdits[k], was = spCell(SUPPLY.routes, m, c);
      if (e) { if (e.on && was.length) spEdits[k] = {on: false, at: spToday()}; else delete spEdits[k]; }  // 호출 추정 칸은 지정 → 지움 → 원래대로
      else if (!was.some(spUse)) spEdits[k] = {on: true, at: spToday()}; } }  // 렛서 설정·호출 확인·관리자 지정 기록은 '이 기록 지우기'로만 지운다
  else if (a === "del") spEdits[spKey(m, c)] = {on: false, at: spToday()};
  else if (a === "undo") delete spEdits[spKey(m, c)];
  else if (a === "reset") Object.keys(spEdits).forEach(k => delete spEdits[k]);
  else if (a === "dl") { const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([spJson()], {type: "application/json"}));
    link.download = "demo_internal_routes.json"; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    spMsg = "변경한 경로 파일을 내려받았습니다. GitHub에서 파일 편집을 열어 내용을 모두 지우고 붙여 넣으세요."; }
  spSave(); renderSupply();
  if (key) { const all = [...document.querySelectorAll("#supply [data-sp], #sppanel:not([hidden]) [data-sp]")], to = a === "close" ? prev || {} : {m, c: i};
    const b = all.find(x => x.dataset.sp === a && x.dataset.m === t.dataset.m && x.dataset.c === t.dataset.c)
      || all.find(x => x.dataset.m === to.m && (to.c == null ? x.dataset.sp === "row" : x.dataset.sp === "cell" && +x.dataset.c === to.c));
    if (b) b.focus({preventScroll: true}); }
}

// ---- 상호작용 ----
const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip);
function showTip(t, x, y){ tip.textContent = ""; const b = document.createElement("b"); b.textContent = t.dataset.t1; tip.appendChild(b);
  (t.dataset.t2 || "").split("\n").filter(Boolean).forEach(s => { const sp = document.createElement("div"); sp.textContent = s; tip.appendChild(sp); });
  tip.hidden = false; const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 14)) + "px"; tip.style.top = Math.max(8, Math.min(innerHeight - r.height - 8, y + 14)) + "px"; }
document.addEventListener("pointermove", ev => { const t = ev.target.closest && ev.target.closest("[data-t1]"); if (t) showTip(t, ev.clientX, ev.clientY); else tip.hidden = true; });
document.addEventListener("focusin", ev => { const t = ev.target.closest && ev.target.closest("[data-t1]"); if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left, r.bottom); } else tip.hidden = true; });
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
// 목록 박스(#queue) 안에서만 스크롤해 선택 카드를 보인다. 창 스크롤은 그대로 두고 #detail 이동에 맡긴다.
function showSel(){ const q = document.getElementById("queue"), r = q.querySelector("[aria-current=true]"); if (!r) return;
  const a = q.getBoundingClientRect(), b = r.getBoundingClientRect();
  if (b.top < a.top || b.bottom > a.bottom) q.scrollTop += b.top - a.top - (q.clientHeight - b.height) / 2; }
// 화면 탭(2026-10-28 박건 요청): 변화(요약·캘린더·목록·상세) | 모델별 가격(모델 목록·가격 추이·현재 가격 표).
// 주소는 변화가 #카드id, 모델별 가격이 #m/모델이다. target이 있으면 그 칸(가격 추이 'chart', 현재 가격 표 'table')으로 내려간다.
function setPage(p, model, target){
  document.body.dataset.page = p;
  document.querySelectorAll("[data-ptab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.ptab === p)));
  document.getElementById("ptitle").textContent = {models: "모델별 가격", health: "수집 상태", supply: "공급로 현황"}[p] || "확인할 변화";
  if (p === "health") { renderHealth(); try { history.replaceState(null, "", "#health"); } catch (err) {} return; }
  if (p === "supply") { renderSupply(); try { history.replaceState(null, "", "#supply"); } catch (err) {} return; }
  if (p !== "models") { try { history.replaceState(null, "", state.sel ? "#" + state.sel : location.pathname + location.search); } catch (err) {} return; }
  if (model && MODEL_IDS.includes(model) && model !== trendModel) { trendModel = model; trendMeasure = 0; trendTier = "Standard"; }
  renderPrice();
  try { history.replaceState(null, "", "#m/" + encodeURIComponent(trendModel)); } catch (err) {}
  const to = target === "table" && COMPARE[trendModel] ? "ptable" : target ? "trend" : null;
  if (to) document.getElementById(to).scrollIntoView({behavior: REDUCE ? "auto" : "smooth", block: "start"});
}
function select(id, scroll){ const e = EVENTS.find(x => x.id === id); if (!e && !VG[id]) return;
  if (document.body.dataset.page !== "changes") setPage("changes");
  state.sel = id; missingLink = ""; try { history.replaceState(null, "", "#" + id); } catch (err) {}
  if (e && e.eff) calMonth = monthOf(e.eff);
  renderCalendar(); renderQueue(); renderDetail();
  if (scroll) { showSel(); document.getElementById("detail").scrollIntoView({behavior: REDUCE ? "auto" : "smooth", block: "start"}); } }
function refilter(){ renderQueue(); document.getElementById("queue").scrollTop = 0; }
document.addEventListener("change", ev => { if (ev.target && ev.target.id === "qsort") { state.queueSort = ev.target.value; refilter(); } });
document.addEventListener("click", ev => {
  const pg = ev.target.closest("[data-ptab]"); if (pg) { setPage(pg.dataset.ptab); window.scrollTo(0, 0); return; }
  const sp = ev.target.closest("[data-sp]"); if (sp) { spAct(sp, ev.detail === 0); return; }
  const md_ = ev.target.closest("[data-model]"); if (md_) { setPage("models", md_.dataset.model); return; }
  const tt = ev.target.closest("[data-tier]"); if (tt) { trendTier = tt.dataset.tier; renderPrice(); return; }
  const ms = ev.target.closest("[data-meas]"); if (ms) { trendMeasure = +ms.dataset.meas; renderPrice(); return; }
  const cm = ev.target.closest("[data-cmp]"); if (cm) { trendCompare = cm.dataset.cmp; renderPrice(); return; }
  const rg = ev.target.closest("[data-rng]"); if (rg) { trendRange = rg.dataset.rng; renderPrice(); return; }
  const tr = ev.target.closest("[data-trend]"); if (tr) { setPage("models", tr.dataset.trend, tr.dataset.tview || "chart"); return; }
  const mn = ev.target.closest("[data-mon]");
  if (mn) { if (!mn.disabled) { calMonth = mn.dataset.mon === "today" ? monthOf(TODAY) : addMonth(calMonth, +mn.dataset.mon); renderCalendar(); } return; }
  const kb = ev.target.closest("[data-kind]"); if (kb) { const k = kb.dataset.kind; listOn.has(k) ? listOn.delete(k) : listOn.add(k); refilter(); return; }
  const pb = ev.target.closest("[data-past]"); if (pb) { showPast = !showPast; refilter(); return; }
  const r = ev.target.closest("[data-id]"); if (!r) return;
  const inList = !!r.closest("#queue");
  select(r.dataset.id, !inList || matchMedia("(max-width:940px)").matches);
});
// ---- 수정안: 팀장님 수집 데이터 전체 (모델별 표) ----
let collModel = "gemini-3.8-flash";
const MOD_KO = {llm:"LLM", video:"영상", image:"이미지"};
function renderCollected(){
  const el = document.getElementById("collected"); if (!el || typeof COLLECTED === "undefined") return;
  const R = COLLECTED.runs, ALL = COLLECTED.models, M = ALL[collModel], ids = Object.keys(ALL);
  const grp = k => EVENTS.some(e => e.mid === k) ? "이벤트 모델" : (MOD_KO[ALL[k].modality] || ALL[k].modality);
  const opts = [...new Set(ids.map(grp))].map(g => `<optgroup label="${esc(g)}">${ids.filter(k => grp(k) === g).sort((a, b) => ALL[a].name.localeCompare(ALL[b].name)).map(k => `<option value="${esc(k)}"${k === collModel ? " selected" : ""}>${esc(ALL[k].name)} (${ALL[k].rows.length})</option>`).join("")}</optgroup>`).join("");
  const tdt = t => String(t).slice(5, 16).replace("T", " ").replace("-", "/");
  const total = ids.reduce((a, k) => a + ALL[k].rows.length, 0), nChg = M.rows.filter(r => r[9].length).length;
  const rows = M.rows.map(([route, cond, item, kind, unit, val, t0, t1, n, chg, reason, ef, eu]) => {
    const v = val === "" ? `<span class="unkv" title="${esc(reason)}">숫자 없음</span>${reason ? `<small>${esc(reason.length > 72 ? reason.slice(0, 71) + "…" : reason)}</small>` : ""}` : `$${esc(val)}${unit ? ` <small>/ ${esc(unit)}</small>` : ""}`;
    const per = ef || eu ? `<small>${ef ? esc(ef) + "부터 " : ""}${eu ? esc(eu) + "까지" : ""}</small>` : "";
    const ch = chg.length ? `<span title="${esc(chg.map(c => tdt(c[0]) + "  $" + c[1]).join("\n"))}">${chg.length - 1}번 변동</span><small>${esc((chg.length > 4 ? "… " : "") + chg.slice(-4).map(c => "$" + c[1]).join(" → "))}</small>` : `<span class="z">변동 없음</span>`;
    return `<tr${chg.length ? ` class="chg"` : ""}><td>${esc(route)}</td><td><code>${esc(cond || "—")}</code></td><td>${esc(item)}${kind !== "게시가" ? ` <small>${esc(kind)}</small>` : ""}</td><td class="v">${v}${per}</td><td class="v">${n}회<small>${tdt(t0)} ~ ${tdt(t1)}</small></td><td>${ch}</td></tr>`; }).join("");
  const src = Object.entries(M.src || {}).map(([r, us]) => `<li><b>${esc(r)}</b> ${us.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, ""))}</a>`).join(" · ")}</li>`).join("");
  el.innerHTML = `<div class="ch"><h2>팀장님 수집 데이터 전체</h2><span>수집 ${R.length}회 · ${tdt(R[0][0])} ~ ${tdt(R[R.length - 1][0])} KST · ${ids.length}개 모델 · ${total}개 가격 계열 · 시험 브랜치 실행 2회 제외</span></div>
    <div class="collbar"><label>모델 <select id="collsel">${opts}</select></label><span>${M.rows.length}개 계열 · 값이 바뀐 계열 ${nChg}개</span>${TREND[collModel] ? `<button type="button" class="tlink" data-trend="${esc(collModel)}">단가 추이로 보기 →</button>` : ""}</div>
    <div class="scroll"><table class="colltab"><thead><tr><th>경로</th><th>조건 (수집기 이름)</th><th>항목</th><th>최신 값</th><th>관측</th><th>변동</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${src ? `<details class="tv"><summary>수집 출처 ${Object.keys(M.src).length}개 경로</summary><ul class="srcl">${src}</ul></details>` : ""}`;
}
document.addEventListener("change", ev => { if (ev.target && ev.target.id === "collsel") { collModel = ev.target.value; renderCollected(); } });
renderMeta(); renderCalendar(); renderPrice(); renderQueue(); renderDetail(); showSel();
if (startModel !== null) setPage("models", startModel); else if (startHealth) setPage("health"); else if (startSupply) setPage("supply"); else document.body.dataset.page = "changes";
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(renderPrice, 150); });
</script>
